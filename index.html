
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบทดสอบวัดความรู้พื้นฐาน</title>
  <!-- โหลด Tailwind CSS เพื่อความสวยงาม -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
  <div id="app" class="max-w-4xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-xl">
    
    <!-- ส่วนหัว -->
    <div class="text-center mb-10">
      <h1 class="text-2xl md:text-4xl font-bold text-slate-800 mb-3">แบบทดสอบวัดความรู้</h1>
      <p class="text-slate-500 text-lg">เรื่อง GitHub, VS Code และ Google Apps Script (จำนวน 20 ข้อ)</p>
    </div>

    <!-- ฟอร์มข้อสอบ -->
    <form id="quizForm" onsubmit="submitForm(event)">
      
      <!-- ส่วนกรอกข้อมูลส่วนตัว -->
      <div class="bg-blue-50 p-6 rounded-xl mb-8 border border-blue-100 shadow-sm">
        <h2 class="text-xl font-semibold text-blue-900 mb-4 flex items-center">
          <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          ข้อมูลผู้ทำแบบทดสอบ
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-slate-700 font-medium mb-2">ชื่อโรงเรียน <span class="text-red-500">*</span></label>
            <input type="text" id="school" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="ระบุชื่อโรงเรียนของคุณ">
          </div>
          <div>
            <label class="block text-slate-700 font-medium mb-2">ชื่อ - นามสกุล <span class="text-red-500">*</span></label>
            <input type="text" id="name" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="ระบุชื่อและนามสกุล">
          </div>
        </div>
      </div>

      <!-- คอนเทนเนอร์สำหรับใส่ข้อสอบที่เรนเดอร์จาก JS -->
      <div id="questionsContainer" class="space-y-6"></div>

      <!-- ปุ่มส่งคำตอบ -->
      <div class="mt-12 text-center border-t pt-8">
        <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transition duration-300 w-full md:w-auto text-xl">
          ส่งคำตอบและดูคะแนน
        </button>
      </div>
    </form>

    <!-- ส่วนแสดงผลคะแนน (ซ่อนไว้จนกว่าจะส่งคำตอบสำเร็จ) -->
    <div id="resultContainer" class="hidden text-center py-16">
      <div class="inline-flex items-center justify-center bg-green-100 w-24 h-24 rounded-full mb-6 shadow-sm">
        <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <h2 class="text-3xl md:text-4xl font-bold text-slate-800 mb-4">ส่งคำตอบเรียบร้อยแล้ว!</h2>
      <p class="text-xl text-slate-600 mb-8">คุณ <span id="resName" class="font-bold text-blue-600"></span> <br class="md:hidden"> จาก <span id="resSchool" class="font-bold text-blue-600"></span></p>
      
      <div class="bg-slate-50 border-2 border-slate-100 rounded-3xl p-10 inline-block shadow-inner">
        <p class="text-slate-500 font-semibold mb-3 text-lg">คะแนนของคุณคือ</p>
        <div class="text-7xl md:text-8xl font-black text-blue-600 tracking-tighter">
          <span id="scoreText"></span><span class="text-4xl md:text-5xl text-slate-300">/20</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ชุดข้อสอบ (ไม่มีเฉลยฝังอยู่ในนี้)
    const questions = [
      { q: "GitHub คืออะไร?", options: ["โปรแกรมสำหรับพิมพ์งานเอกสาร", "แพลตฟอร์มออนไลน์สำหรับจัดการและจัดเก็บ Source code", "เว็บไซต์สำหรับเรียนออนไลน์", "ภาษาโปรแกรมชนิดหนึ่ง"] },
      { q: "คำสั่งใดใช้สำหรับนำโค้ดจากเครื่องเราขึ้นไปเก็บบน GitHub?", options: ["git clone", "git commit", "git push", "git pull"] },
      { q: "คำสั่งใดใช้ทำสำเนา (Copy) โปรเจกต์จาก GitHub มาไว้ที่เครื่องของเรา?", options: ["git clone", "git copy", "git init", "git branch"] },
      { q: "\"Branch\" ใน Git/GitHub มีไว้เพื่อวัตถุประสงค์ใด?", options: ["เพื่อลบโค้ดส่วนที่ไม่ใช้งานทิ้ง", "เพื่ออัปโหลดไฟล์รูปภาพแยกต่างหาก", "เพื่อแยกการพัฒนาฟีเจอร์ใหม่โดยไม่กระทบกับโค้ดหลัก", "เพื่อรวมไฟล์หลายไฟล์เป็นไฟล์เดียว"] },
      { q: "ไฟล์ใดที่ใช้สำหรับกำหนดว่าไม่ต้องการให้ Git อัปโหลดไฟล์นั้นขึ้น GitHub?", options: [".gitblock", ".gitignore", ".githide", ".gitremove"] },
      { q: "คำสั่งใดใช้บันทึกการเปลี่ยนแปลงของไฟล์ใน Git?", options: ["git save", "git push", "git record", "git commit"] },
      { q: "การ \"Pull Request\" คืออะไร?", options: ["การดึงโค้ดทั้งหมดลงมาที่เครื่องส่วนตัว", "การขอลบโปรเจกต์ (Repository)", "การเสนอให้นำโค้ดที่เราแก้ไขไปรวมกับโค้ดหลัก", "การสร้างสาขา (Branch) ใหม่"] },
      { q: "VS Code ย่อมาจากอะไร?", options: ["Visual System Code", "Virtual Studio Code", "Visual Studio Code", "Virtual System Code"] },
      { q: "หากต้องการพิมพ์คำสั่ง Command Line (เช่น คำสั่ง git) ใน VS Code สามารถทำได้ที่หน้าต่างใด?", options: ["Explorer", "Terminal", "Extensions", "Source Control"] },
      { q: "ฟีเจอร์ใดใน VS Code ที่ช่วยให้เราติดตั้งเครื่องมือเสริมเพิ่มความสามารถให้กับโปรแกรม?", options: ["Plugins", "Add-ons", "Extensions", "Modules"] },
      { q: "ปุ่มคีย์ลัด (Shortcut) ใดใช้สำหรับเปิด Command Palette ใน VS Code อย่างรวดเร็ว?", options: ["Ctrl + C", "Ctrl + Shift + P", "Alt + F4", "Ctrl + V"] },
      { q: "VS Code ถูกพัฒนาขึ้นโดยบริษัทใด?", options: ["Google", "Apple", "Facebook", "Microsoft"] },
      { q: "โครงสร้างโฟลเดอร์หรือพื้นที่จัดเก็บโปรเจกต์ที่เราเปิดทำงานใน VS Code เรียกว่าอะไร?", options: ["Workspace", "Database", "Cloud Area", "Server Space"] },
      { q: "Google Apps Script (GAS) เขียนด้วยภาษาโปรแกรมใดเป็นหลัก?", options: ["Python", "PHP", "JavaScript", "Java"] },
      { q: "หากต้องการเชื่อมต่อและจัดการข้อมูลใน Google Sheets ต้องใช้คลาส (Class) ใดใน GAS?", options: ["DocumentApp", "SpreadsheetApp", "FormApp", "DriveApp"] },
      { q: "นามสกุลไฟล์ของสคริปต์ Google Apps Script คืออะไร?", options: [".gas", ".js", ".gs", ".script"] },
      { q: "หากต้องการแสดงผลข้อความในหน้าต่างการทำงาน (Execution log) ของ GAS ต้องใช้คำสั่งใด?", options: ["console.print()", "document.write()", "Logger.log()", "print()"] },
      { q: "ฟังก์ชันใดที่จำเป็นต้องมี หากต้องการให้ GAS ทำงานเป็น Web App เพื่อแสดงหน้าเว็บ HTML?", options: ["doPost()", "doGet()", "onEdit()", "onOpen()"] },
      { q: "ทริกเกอร์ (Triggers) ใน GAS มีหน้าที่ทำอะไร?", options: ["ตกแต่งหน้าตาเว็บไซต์", "ลบข้อมูลใน Google Sheets ทิ้ง", "ตั้งเวลาให้สคริปต์ทำงานอัตโนมัติตามกำหนด", "บล็อกผู้ใช้งานที่เป็นสแปม"] },
      { q: "เครื่องมือ Command Line ใดที่ใช้ดึงโค้ด GAS มาเขียนและซิงค์ใน VS Code ได้?", options: ["npm", "clasp", "gas-cli", "git"] }
    ];

    // โหลดข้อสอบลงในหน้าเว็บ
    const container = document.getElementById('questionsContainer');
    questions.forEach((q, index) => {
      let optionsHtml = '';
      q.options.forEach((opt, optIndex) => {
        optionsHtml += `
          <label class="flex items-start p-4 rounded-xl cursor-pointer border-2 border-transparent hover:border-blue-100 hover:bg-blue-50/50 transition duration-200">
            <div class="flex-shrink-0 h-6 flex items-center">
              <input type="radio" name="q${index}" value="${optIndex}" required class="w-5 h-5 text-blue-600 border-slate-300 focus:ring-blue-500 mt-0.5">
            </div>
            <span class="ml-3 text-slate-700 text-lg">${opt}</span>
          </label>
        `;
      });

      container.innerHTML += `
        <div class="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm">
          <h3 class="font-bold text-slate-800 text-lg md:text-xl mb-5 flex items-start">
            <span class="bg-blue-100 text-blue-800 rounded-lg min-w-[2.5rem] h-10 inline-flex items-center justify-center mr-3 flex-shrink-0">${index + 1}</span> 
            <span class="pt-1">${q.q}</span>
          </h3>
          <div class="space-y-1 pl-1 md:pl-12">
            ${optionsHtml}
          </div>
        </div>
      `;
    });

    // ฟังก์ชันเมื่อกดปุ่มส่งคำตอบ
    function submitForm(event) {
      event.preventDefault();

      // ⚠️ ให้นำ URL Web App และ Google Sheet ID มาใส่ในเครื่องหมายคำพูดด้านล่าง
      const GAS_WEB_APP_URL = 'const GAS_WEB_APP_URL = 'https://script.google.com/a/macros/ncc.ac.th/s/AKfycbynRtPwW8rdWCdYdUgooGZ2pauCfyAk8s_YrhPx-XG-oMtmR5MjNVyjrRLH9S2Ki1Zt/exec';';
      const TARGET_SHEET_ID = 'YOUR_GOOGLE_SHEET_ID';

      if (GAS_WEB_APP_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL' || TARGET_SHEET_ID === '18kIoCbh0mMf688dP9iqgtFvDGhZ8ITbTvezqLWH33ZU') {
        alert('กรุณานำ Web App URL และ Sheet ID มาใส่ในโค้ดก่อนครับ');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังตรวจข้อสอบ...`;

      // รวบรวมข้อมูล
      const userData = {
        sheetId: TARGET_SHEET_ID, // เพิ่มการส่ง Sheet ID ไปให้ Backend
        school: document.getElementById('school').value,
        name: document.getElementById('name').value,
        answers: []
      };

      for (let i = 0; i < questions.length; i++) {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        userData.answers.push(selected ? parseInt(selected.value) : -1);
      }

      // ส่งข้อมูลไปยัง Google Apps Script (Backend API)
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(userData) // ไม่ระบุ headers Content-Type เพื่อป้องกัน CORS Preflight
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          // ซ่อนฟอร์ม และแสดงผลคะแนน
          document.getElementById('quizForm').classList.add('hidden');
          document.getElementById('resultContainer').classList.remove('hidden');
          
          document.getElementById('resName').innerText = userData.name;
          document.getElementById('resSchool').innerText = userData.school;
          document.getElementById('scoreText').innerText = data.score;
          
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          alert('เกิดข้อผิดพลาดจากฝั่งฐานข้อมูล: ' + data.message);
          btn.disabled = false;
          btn.innerText = 'ส่งคำตอบและดูคะแนน';
        }
      })
      .catch(error => {
        alert('ไม่สามารถเชื่อมต่อฐานข้อมูลได้: ' + error.message);
        btn.disabled = false;
        btn.innerText = 'ส่งคำตอบและดูคะแนน';
      });
    }
  </script>
</body>
</html>
